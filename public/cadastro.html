<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Explore Brasil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="bg-light">

    <!-- ==========================================
                    NAVBAR
    =========================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">

                🌎 Explore Brasil

            </a>

        </div>

    </nav>

    <!-- ==========================================
                    CADASTRO
    =========================================== -->

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8 mt-5">

                <div class="card shadow-lg">

                    <div class="card-header bg-success text-white text-center">

                        <h2>

                            <i class="bi bi-person-plus-fill"></i>

                            Criar Conta

                        </h2>

                    </div>

                    <div class="card-body p-4">

                        <form id="formCadastro">

                            <!-- Nome -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Nome Completo

                                </label>

                                <input type="text" id="nome" class="form-control" placeholder="Digite seu nome"
                                    required>

                            </div>

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    E-mail

                                </label>

                                <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail"
                                    required>

                            </div>

                            <!-- Login -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Login

                                </label>

                                <input type="text" id="login" class="form-control" placeholder="Escolha um login"
                                    required>

                            </div>

                            <!-- Senha -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Senha

                                </label>

                                <input type="password" id="senha" class="form-control" placeholder="Crie uma senha"
                                    required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">

                                    Confirmar Senha

                                </label>

                                <input type="password" id="confirmarSenha" class="form-control"
                                    placeholder="Confirme sua senha" required>

                            </div>

                            <!-- Botão -->

                            <button type="submit" class="btn btn-success w-100">

                                <i class="bi bi-person-check-fill"></i>

                                Cadastrar

                            </button>

                        </form>

                        <hr>

                        <div class="text-center">

                            Já possui uma conta?

                            <a href="login.html">

                                Fazer Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login/Cadastro -->

    <script src="assets/js/login.js"></script>

    <script src="assets/js/api.js"></script>

</body>

</html>
