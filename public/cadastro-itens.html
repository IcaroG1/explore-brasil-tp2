<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Destinos | Explore Brasil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="bg-light">

    <!-- ===========================
            NAVBAR
    ============================ -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">

                🌎 Explore Brasil

            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto" id="menuUsuario"></ul>

            </div>

        </div>

    </nav>

    <!-- ===========================
            CONTEÚDO
    ============================ -->

    <div class="container my-5">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">

                    <i class="bi bi-pencil-square"></i>

                    Cadastro de Destinos

                </h3>

            </div>

            <div class="card-body">

                <form id="formLugar">

                    <input type="hidden" id="id">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Nome do Destino

                            </label>

                            <input
                                type="text"
                                id="nome"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Cidade

                            </label>

                            <input
                                type="text"
                                id="cidade"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Estado

                            </label>

                            <select
                                id="estado"
                                class="form-select"
                                required>

                                <option value="">Selecione...</option>

                                <option>Bahia</option>
                                <option>Ceará</option>
                                <option>Maranhão</option>
                                <option>Mato Grosso do Sul</option>
                                <option>Minas Gerais</option>
                                <option>Paraná</option>
                                <option>Pernambuco</option>
                                <option>Rio de Janeiro</option>
                                <option>Rio Grande do Norte</option>
                                <option>Rio Grande do Sul</option>
                                <option>Tocantins</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Categoria

                            </label>

                            <select
                                id="categoria"
                                class="form-select"
                                required>

                                <option value="">Selecione...</option>

                                <option>Praia</option>
                                <option>Natureza</option>
                                <option>Monumento</option>
                                <option>História</option>
                                <option>Ecoturismo</option>
                                <option>Cidade</option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Imagem

                        </label>

                        <select
                            id="imagem"
                            class="form-select">

                            <option value="assets/img/cristo.jpg">Cristo Redentor</option>
                            <option value="assets/img/cataratas.jpg">Cataratas do Iguaçu</option>
                            <option value="assets/img/lencois.jpg">Lençóis Maranhenses</option>
                            <option value="assets/img/pelourinho.jpg">Pelourinho</option>
                            <option value="assets/img/noronha.jpg">Fernando de Noronha</option>
                            <option value="assets/img/jalapao.jpg">Jalapão</option>
                            <option value="assets/img/chapada.jpg">Chapada Diamantina</option>
                            <option value="assets/img/ouropreto.jpg">Ouro Preto</option>
                            <option value="assets/img/pipa.jpg">Praia de Pipa</option>
                            <option value="assets/img/bonito.jpg">Bonito</option>
                            <option value="assets/img/gramado.jpg">Gramado</option>
                            <option value="assets/img/jeri.jpg">Jericoacoara</option>

                        </select>

                    </div>

                    <div class="text-center mb-4">

                        <img
                            id="preview"
                            src="assets/img/cristo.jpg"
                            class="img-fluid rounded shadow"
                            style="max-height:250px;">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Descrição

                        </label>

                        <textarea
                            id="descricao"
                            rows="5"
                            class="form-control"
                            required></textarea>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Avaliação

                        </label>

                        <input
                            type="range"
                            id="avaliacao"
                            class="form-range"
                            min="0"
                            max="5"
                            step="0.1"
                            value="5">

                        <p>

                            Nota:

                            <strong>

                                <span id="valorNota">

                                    5.0

                                </span>

                            </strong>

                        </p>

                    </div>

                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="destaque">

                        <label class="form-check-label">

                            Exibir no Carrossel

                        </label>

                    </div>

                    <button
                        class="btn btn-success"
                        type="submit">

                        <i class="bi bi-floppy"></i>

                        Salvar

                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary">

                        <i class="bi bi-eraser"></i>

                        Limpar

                    </button>

                    <button
                        type="button"
                        class="btn btn-danger"
                        onclick="limparFormulario()">

                        <i class="bi bi-x-circle"></i>

                        Cancelar edição

                    </button>

                </form>

            </div>

        </div>

        <div class="card shadow mt-5">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">

                    Destinos Cadastrados

                </h4>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead>

                            <tr>

                                <th>Imagem</th>

                                <th>Nome</th>

                                <th>Categoria</th>

                                <th>Cidade</th>

                                <th>Estado</th>

                                <th>⭐</th>

                                <th>Ações</th>

                            </tr>

                        </thead>

                        <tbody id="tabelaLugares">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login -->

    <script src="assets/js/login.js"></script>

    <!-- Navbar -->

    <script src="assets/js/navbar.js"></script>

    <!-- CRUD -->

    <script src="assets/js/crud.js"></script>

    <script src="assets/js/api.js"></script>

</body>

</html>
